services:
  app:
    build: .
    ports:
      - "6000:6000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - turn
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  turn:
    image: coturn/coturn:4.6.3
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${TURN_REALM:-peerdrop.local}
      - --user=${TURN_USERNAME:-peerdrop}:${TURN_PASSWORD:-change-me}
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --listening-ip=0.0.0.0
      - --relay-ip=0.0.0.0
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: always
